<!DOCTYPE html>
<html lang="en" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<title>LOSTEGAME</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;color:#fff;
  font:14px/1.7 "Courier New",Courier,monospace;
  display:flex;align-items:center;justify-content:center}
#w{width:100%;max-width:520px;padding:0 24px}

.brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;
  color:#444;margin-bottom:24px;display:flex;align-items:center;}
.brand img{width:24px;height:24px;border-radius:50%;margin-right:12px;}

hr{border:none;border-top:1px solid #1a1a1a;margin:14px 0}
.row{display:flex;justify-content:space-between;min-height:24px;
  align-items:baseline;gap:8px}
.lbl{color:#555;white-space:nowrap;min-width:80px}
.val{text-align:right;word-break:break-all}

.ok{color:#0f0}
.warn{color:#fc0}
.err{color:#f44}
.dim{color:#444}

#picker{margin-top:26px;display:none}
.ptitle{font-size:11px;letter-spacing:.25em;text-transform:uppercase;
  color:#555;margin-bottom:14px;text-align:center;}
.btns{display:flex;gap:12px}
.btn{flex:1;padding:14px 0;background:#fff;color:#000;border:none;
  font:bold 13px/1 "Courier New",Courier,monospace;
  cursor:pointer;text-transform:uppercase;letter-spacing:.1em;
  text-align:center;}
.btn:hover:not(:disabled){background:#ccc}
.btn.ghost{background:#000;color:#fff;border:1px solid #333}
.btn.ghost:hover:not(:disabled){border-color:#666;color:#ccc}

.btn:focus:not(:disabled), .btn.ghost:focus:not(:disabled) { outline: 2px solid #0078d7; outline-offset: 2px; }

.btn:disabled {
  background: #1a1a1a;
  color: #555;
  border-color: #1a1a1a;
  cursor: not-allowed;
}

#note{margin-top:18px;font-size:11px;color:#444;min-height:18px;text-align:center;}
</style>
</head>

  <div class="row"><span class="lbl">Status</span><span class="val" id="v-st">detecting firmware...</span></div>
  <div class="row"><span class="lbl">Cache</span><span class="val" id="v-cache">&mdash;</span></div>
  <hr>

  <div id="picker">
    <div class="ptitle" id="picker-title">Ready</div>
    <div class="btns" id="btn-container"></div>
  </div>
  <div id="note"></div>
</div>

<script>
(function () {
    function $(id) { return document.getElementById(id); }
    function set(id, txt, cls) {
        var e = $(id);
        if (e) {
            e.textContent = txt;
            e.className = "val" + (cls ? " " + cls : "");
        }
    }
    function setState(t, c) {
        var cls = c === "warn" ? "warn" : c === "bad" ? "err" : c === "ok" ? "ok" : "";
        set("v-st", t, cls);
    }
    function setCache(t, ok) {
        set("v-cache", t, ok ? "ok" : "dim");
    }

    var params = new URLSearchParams(location.search);
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 };

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);

    set("v-fw", key || "Not a PS4", key ? "ok" : "err");
    set("v-sup", supported ? "Supported" : "Not supported", supported ? "ok" : "err");

    function go(payload) {
        setState("Loading jailbreak...", "warn");
        var options = new URLSearchParams(location.search || location.hash.slice(1));
        if (payload) options.set("payload", payload);
        var query = options.toString();
        location.replace("load.html" + (query ? "#" + query : ""));
    }

    function showPicker(isSupported) {
        var picker = $("picker");
        var container = $("btn-container");
        var ptitle = $("picker-title");

        picker.style.display = "block";
        container.innerHTML = "";

        if (!isSupported) {
            setState("Unsupported firmware", "err");
            ptitle.textContent = "Unsupported (" + (key || "unknown") + ")";

            var btn = document.createElement("button");
            btn.className = "btn ghost";
            btn.textContent = "Run Anyway";
            btn.onclick = function () { go(); };
            container.appendChild(btn);
            btn.focus();
        } else {
            setState("Ready", "ok");
            ptitle.textContent = "Choose Payload (Press X)";

            /* ── GoldHEN (default, always focused first) ── */
            var btnGH = document.createElement("button");
            btnGH.className = "btn";
            btnGH.textContent = "GoldHEN";
            btnGH.setAttribute("tabindex", "1");
            btnGH.onclick = function () { go("goldhen"); };

            /* ── HEN (only reachable by navigating right / sliding pad) ── */
            var btnHen = document.createElement("button");
            btnHen.className = "btn ghost";
            btnHen.textContent = "HEN";
            btnHen.setAttribute("tabindex", "2");
            btnHen.onclick = function () { go("hen"); };

            container.appendChild(btnGH);
            container.appendChild(btnHen);

            /*
             * Always focus GoldHEN regardless of firmware version.
             * On PS4 the controller's X button fires as Enter/Space
             * on the currently focused element, so pressing X with
             * no prior navigation will always trigger GoldHEN.
             * The user must press Right on the D-pad / swipe the
             * touchpad to move focus to HEN before pressing X.
             */
            btnGH.focus();

            /*
             * Keyboard trap: arrow-key / D-pad navigation between
             * the two buttons so the PS4 controller works correctly.
             */
            function handleNav(e) {
                var focused = document.activeElement;
                if (e.key === "ArrowRight" || e.key === "ArrowDown") {
                    e.preventDefault();
                    if (focused === btnGH) { btnHen.focus(); }
                } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
                    e.preventDefault();
                    if (focused === btnHen) { btnGH.focus(); }
                }
            }

            btnGH.addEventListener("keydown", handleNav);
            btnHen.addEventListener("keydown", handleNav);
        }
    }

    function promptReload() {
        setState("Update Ready", "warn");
        var picker = $("picker");
        var container = $("btn-container");
        var ptitle = $("picker-title");

        picker.style.display = "block";
        ptitle.textContent = "Cache Updated";
        container.innerHTML = "";

        var btn = document.createElement("button");
        btn.className = "btn";
        btn.textContent = "Reload Page";
        btn.onclick = function () { location.reload(); };
        container.appendChild(btn);
        btn.focus();
    }

    var ac = window.applicationCache;

    function cacheReady() {
        setCache("cached -- offline ready", true);
        showPicker(supported);
    }
    function cacheError() {
        if (ac.status === ac.IDLE) return cacheReady();
        setCache("cache unavailable -- reconnect and reload", false);
        showPicker(supported);
    }
    function cacheUpdated() {
        try { ac.swapCache(); } catch (e) {}
        setCache("update downloaded", true);
        promptReload();
    }
    function cacheDownloading() {
        setCache("caching for offline...", false);
        $("picker").style.display = "none";
    }

    if (!ac) {
        setCache("offline caching not supported", false);
        showPicker(supported);
    } else {
        ac.addEventListener("downloading", cacheDownloading, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total) setCache("caching " + Math.round(e.loaded / e.total * 100) + "%", false);
        }, false);
        ac.addEventListener("cached",      cacheReady,    false);
        ac.addEventListener("noupdate",    cacheReady,    false);
        ac.addEventListener("updateready", cacheUpdated,  false);
        ac.addEventListener("error",       cacheError,    false);
        ac.addEventListener("obsolete",    cacheError,    false);

        if      (ac.status === ac.UPDATEREADY)  cacheUpdated();
        else if (ac.status === ac.IDLE)         cacheReady();
        else if (ac.status === ac.DOWNLOADING)  cacheDownloading();
        else if (!navigator.onLine || ac.status === ac.OBSOLETE) cacheError();
        else setCache("checking cache...", false);
    }
})();
</script>
</body>
</html>
